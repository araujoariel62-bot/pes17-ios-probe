name: Build MemProbe.ipa

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MemProbe-ipa
          path: build/MemProbe.ipa
